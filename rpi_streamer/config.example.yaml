# RPi Camera Streamer Configuration
# Copy to config.yaml and adjust for your setup
#
# camera_source options:
#   synthetic  - generated test pattern (works everywhere)
#   macos      - macOS built-in or USB camera via OpenCV
#   rpi        - Raspberry Pi regular camera (Camera Module 3, etc.) with motion detection
#   rpi_ai     - Raspberry Pi AI Camera (IMX500) with hardware detection

server_url: "ws://localhost:8000/ws/camera/feed/"
camera_token: ""  # Set locally or use configs/.token
camera_id: "cam-1"
camera_source: "synthetic"

frame_width: 640
frame_height: 480
fps: 15
idle_fps: 1  # Low FPS when no motion/detection (1 frame per 10s)
jpeg_quality: 70

# Optional: Camera rotation in degrees (0, 90, 180, 270)
# Use this if your camera is physically mounted at an angle
# Only applies to "rpi" camera source
# camera_rotation: 0

# Optional: Motion detection tuning (for "rpi" and "macos" sources)
# motion_threshold: 25      # Pixel difference threshold (default: 25)
# min_motion_area: 500      # Minimum changed pixels for motion (default: 500)
# detection_cooldown: 3.0   # Seconds to stay at high FPS after motion stops (default: 3.0)

