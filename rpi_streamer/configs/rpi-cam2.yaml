# RPi Camera 2 (streamer2 @ 192.168.1.102) — H.264 hardware encoding
# Connects to macOS server at 192.168.1.101 (network+nginx mode)
server_url: "ws://192.168.1.101/ws/camera/feed/"
camera_id: "rpi-cam2"
camera_source: "rpi"

frame_width: 1920
frame_height: 1080
fps: 25             # FPS when motion detected
idle_fps: 1         # FPS when idle
h264_bitrate: 2000000  # 2 Mbps target bitrate for H.264

# Adjust to physical camera orientation on streamer2
camera_rotation: 270

# Motion detection tuning
# motion_threshold: 25
# min_motion_area: 500
# detection_cooldown: 3.0
