# Copy to rpi-cam2.yaml and configure locally. Never commit real tokens.
# RPi Camera 2 — H.264 hardware encoding
# Set server_url to your own server before starting.
server_url: "ws://localhost:8000/ws/camera/feed/"
camera_token: ""  # Read from the ignored configs/.token file
camera_id: "rpi-cam2"
camera_source: "rpi"

frame_width: 1920
frame_height: 1080
fps: 25             # FPS when motion detected
idle_fps: 1         # FPS when idle
h264_bitrate: 2000000  # 2 Mbps target bitrate for H.264

# Adjust to physical camera orientation on streamer2
camera_rotation: 270

# Motion detection tuning
# motion_threshold: 25
# min_motion_area: 500
# detection_cooldown: 3.0
