# RPi AI Camera — Raspberry Pi AI Camera (IMX500) with hardware detection
# Dynamically switches between 0.1 FPS (idle) and 30 FPS (detecting)
# Deploy this file as config.yaml on the RPi
server_url: "ws://192.168.1.101:8000/ws/camera/feed/"
camera_id: "rpi-ai-cam"
camera_source: "rpi_ai"

frame_width: 1920  # 1080p resolution
frame_height: 1080
fps: 30  # Max FPS (when detecting)
idle_fps: 1  # FPS when idle (no detection, 1 frame per 10s)
jpeg_quality: 70
