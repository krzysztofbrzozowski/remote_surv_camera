{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 — Not Found — Telemetry</title>
    {% include "stream/includes/favicons.html" %}
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: #fff;
            color: #171717;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-wrap { text-align: center; }
        .error-code { font-size: 5em; font-weight: 500; letter-spacing: -0.04em; color: #e5e5e5; }
        .error-msg { font-size: 1.1em; color: #737373; margin-top: 8px; }
        .error-link { display: inline-block; margin-top: 28px; font-size: 0.9em; color: #525252; text-decoration: underline; text-underline-offset: 4px; }
        .error-link:hover { color: #171717; }
    </style>
</head>
<body>
    <div class="error-wrap">
        <div class="error-code">404</div>
        <div class="error-msg">there is no such page</div>
        <a class="error-link" href="/">go back</a>
    </div>
</body>
</html>
