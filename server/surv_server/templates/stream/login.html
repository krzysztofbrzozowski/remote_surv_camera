{% extends "stream/base.html" %}
{% block title %}Sign in{% endblock %}

{% block content %}
<div style="max-width: 380px; margin: 80px auto;">
    <div style="text-align:center; margin-bottom: 32px;">
        <h1 style="font-size:1.4em; font-weight:600;">Sign in</h1>
    </div>
    <div class="card">
        {% if error %}
        <div style="background:var(--fill); border:1px solid var(--red); border-radius:12px; padding:10px 14px; margin-bottom:16px; color:var(--red); font-size:0.9em;">{{ error }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="username">Username</label>
            <input type="text" name="username" id="username" autofocus required placeholder="Enter username">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required placeholder="Enter password">
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:4px; padding:11px; font-size:0.95em; border-radius:12px;">Sign in</button>
        </form>
    </div>
</div>
{% endblock %}
