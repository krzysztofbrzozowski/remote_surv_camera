{% load i18n %}
<div class="tf-actions">
{% if wizard.steps.prev %}
  <button name="wizard_goto_step" type="submit" value="{{ wizard.steps.prev }}" class="btn">{% trans "Back" %}</button>
{% endif %}
  <button type="submit" class="btn btn-primary">{% trans "Next" %}</button>
{% if cancel_url %}
  <a href="{{ cancel_url }}" class="btn-link" style="margin-left:auto;">{% trans "Cancel" %}</a>
{% endif %}
</div>
